	<div class="contact-title-container">
		<h1 class="heading-1">Contactează-ne</h1>
	</div>
	<div class="contact-form-container">
		<div class="row">
			<div class="contact-form col-sm-10 col-md-8">
					<form method="post">
						<input type="hidden" name="action" value="contact">
						<div class="form-group ">
							<label>Nume</label>
							<input type="text" name="name.full"  class="form-control" value="">
						</div>
						<div class="form-group ">
							<label>Email</label>
							<input type="email" name="email" class="form-control" value="">
						</div>
						<div class="form-group">
							<label>Telefon</label>
							<input type="text" name="phone" placeholder="(optional)" class="form-control" value="">
						</div>
						<div class="form-group ">
							<label>Care este motivul pentru care ne contactezi?</label>
							<select name="enquiryType" class="form-control">
								<option value="">(selectează un motiv)</option>
									<option value="message">Doar las un mesaj</option>
									<option value="question">Am o întrebare</option>
									<option value="other">Alt motiv...</option>
							</select>
						</div>
						<div class="form-group  ">
							<label>Mesaj</label>
							<textarea name="message" placeholder="Scrie mesajul tău aici..." rows="4" class="form-control"></textarea>
						</div>
						<div class="form-actions">
							<button type="submit" class="btn btn-primary">Trimite</button>
						</div>
					</form>
			</div>
		</div>
	</div>
